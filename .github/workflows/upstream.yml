name: Upstream dsh

# Follows npm's `latest` dsh. When it moves past the version runtime/package.json
# pins, the runtime is locked and booted once here first; only then are an issue
# and a pull request that closes it opened. Merging that pull request publishes a
# new app version (see ci.yml). Pull requests opened with the built-in token do
# not start CI, which is why this run does the building. Opening them at all needs
# Settings → Actions → General → "Allow GitHub Actions to create and approve pull
# requests".
on:
  schedule:
    - cron: '20 1 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: A dsh version to pin instead of npm's latest, e.g. 0.1.6-alpha.2
        required: false

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: upstream-dsh
  cancel-in-progress: false

jobs:
  check:
    name: Check npm for a newer dsh
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      locked: ${{ steps.check.outputs.locked }}
    steps:
      - uses: actions/checkout@v7

      - id: check
        env:
          WANTED: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          locked="$(sed -n 's/^    "@deepseek-ai\/dsh": "\(.*\)"$/\1/p' runtime/package.json)"
          wanted="${WANTED:-$(npm view @deepseek-ai/dsh@latest version)}"
          echo "locked $locked, npm offers $wanted"
          echo "locked=$locked" >> "$GITHUB_OUTPUT"
          if [ "$locked" = "$wanted" ]; then
            echo "::notice::the runtime already pins dsh $wanted"
            exit 0
          fi
          # A pull request for this version, open or closed, means it was proposed already.
          # A branch without one is left from a run that failed before opening it: redo it.
          proposed="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "chore/dsh-$wanted" --state all --json url --jq '.[0].url // empty')"
          if [ -n "$proposed" ]; then
            echo "::notice::dsh $wanted was already proposed in $proposed"
            exit 0
          fi
          echo "version=$wanted" >> "$GITHUB_OUTPUT"

  propose:
    name: Lock and boot dsh ${{ needs.check.outputs.version }}
    needs: check
    if: needs.check.outputs.version != ''
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DSH_VERSION: ${{ needs.check.outputs.version }}
      LOCKED: ${{ needs.check.outputs.locked }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: .cache
          key: runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtime/pnpm-lock.yaml', 'scripts/config.sh') }}
          restore-keys: |
            runtime-${{ runner.os }}-${{ runner.arch }}-

      # Both steps reach the network; a stalled one fails here instead of burning
      # the job's time (pnpm's supply-chain policy service has hung before).
      - name: Lock the new version
        timeout-minutes: 15
        run: make lock

      - name: Install the runtime and boot it once
        timeout-minutes: 25
        run: scripts/prepare-payload.sh

      - name: Open the issue and the pull request
        run: |
          branch="chore/dsh-$DSH_VERSION"
          engines="$(npm view "@deepseek-ai/dsh@$DSH_VERSION" engines.node)"
          packages="$(grep -c 'resolution: {integrity' runtime/pnpm-lock.yaml)"
          node="$(bash -c 'source scripts/config.sh; echo "$NODE_VERSION"')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add runtime/package.json runtime/pnpm-lock.yaml
          git commit -m "chore: 升级 dsh 到 $DSH_VERSION"
          # The branch may be left from a run that failed before opening the pull request.
          git push --force -u origin "$branch"

          cat > "$RUNNER_TEMP/issue.md" <<EOF
          npm 上的 \`@deepseek-ai/dsh\` 已发布 **$DSH_VERSION**，仓库当前锁定的是 $LOCKED。

          - npm：https://www.npmjs.com/package/@deepseek-ai/dsh/v/$DSH_VERSION
          - 上游 tag：https://github.com/deepseek-ai/deepseek-harness/releases/tag/dsh-v$DSH_VERSION

          升级用的 PR 已经自动提交，合并即发布新版 App。
          EOF
          # Reuse the issue such a failed run opened.
          export ISSUE_TITLE="dsh $DSH_VERSION 已发布"
          issue="$(gh issue list --state open --limit 100 --json title,url --jq '[.[] | select(.title == env.ISSUE_TITLE)][0].url // empty')"
          if [ -z "$issue" ]; then
            issue="$(gh issue create --title "$ISSUE_TITLE" --body-file "$RUNNER_TEMP/issue.md")"
          fi

          cat > "$RUNNER_TEMP/pr.md" <<EOF
          把内置运行时从 dsh $LOCKED 升到 **$DSH_VERSION**。

          - **依赖**：锁文件共 $packages 个包
          - **Node**：仓库固定 $node，dsh $DSH_VERSION 要求 \`$engines\`
          - **验证**：本次运行已在 macOS arm64 上按新锁文件装好运行时，并成功启动一次 dsh（冒烟测试）

          合并后会自动发布新版 App，版本号取最近 v* tag 的补丁号加一；还没有 tag 时不会自动发布，第一个正式版本需要手动打 tag。

          Closes $issue
          EOF
          if ! gh pr create --base main --head "$branch" --title "chore: 升级 dsh 到 $DSH_VERSION" --body-file "$RUNNER_TEMP/pr.md"; then
            echo "::error::could not open the pull request. If GitHub Actions is not permitted to create pull requests, enable Settings → Actions → General → Allow GitHub Actions to create and approve pull requests; the next run (or a re-run) reuses $branch and $issue."
            exit 1
          fi
